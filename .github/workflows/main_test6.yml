# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - test6

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B clean install

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    # Deploy only when triggered manually to avoid failing pushes when the Azure Web App is unavailable
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4481B5BE0F9D4D5880156660BFC3F634 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0D8EC17B965C48568035D5C5C9630301 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AD83DE82B1B045979882A0044C73B8A1 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'test6'
          slot-name: 'Production'
          package: '*.jar'
